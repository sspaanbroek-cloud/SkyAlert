# Deploys everything SkyAlert runs on Supabase: database changes, the
# background jobs (Edge Functions), their secrets, and the schedule settings.
# Run it from GitHub: Actions > Deploy backend > Run workflow. It also runs by
# itself when files under supabase/ change on main.
name: Deploy backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/deploy-backend.yml', '.github/scripts/vault.sql']

concurrency: deploy-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
      OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
      OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
      # Optional: text-message alerts (all three needed to switch texts on)
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_MESSAGING_SERVICE_SID: ${{ secrets.TWILIO_MESSAGING_SERVICE_SID }}
      SMS_DAILY_CAP: ${{ secrets.SMS_DAILY_CAP }}
    steps:
      - name: Check that all secrets are filled in
        run: |
          missing=""
          check() { [ -n "$2" ] || missing="$missing $1"; }
          check SUPABASE_ACCESS_TOKEN "$SUPABASE_ACCESS_TOKEN"
          check SUPABASE_PROJECT_REF "$PROJECT_REF"
          check SUPABASE_DB_URL "$DB_URL"
          check INGEST_SECRET "$INGEST_SECRET"
          check OPENSKY_CLIENT_ID "$OPENSKY_CLIENT_ID"
          check OPENSKY_CLIENT_SECRET "$OPENSKY_CLIENT_SECRET"
          check VAPID_PUBLIC_KEY "$VAPID_PUBLIC_KEY"
          check VAPID_PRIVATE_KEY "$VAPID_PRIVATE_KEY"
          check VAPID_SUBJECT "$VAPID_SUBJECT"
          n=0; for v in "$TWILIO_ACCOUNT_SID" "$TWILIO_AUTH_TOKEN" "$TWILIO_MESSAGING_SERVICE_SID"; do [ -n "$v" ] && n=$((n+1)); done
          if [ "$n" -gt 0 ] && [ "$n" -lt 3 ]; then
            echo "::warning::Text alerts need all three of TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN and TWILIO_MESSAGING_SERVICE_SID. Texts stay off until all three are set."
          fi
          if [ -n "$missing" ]; then
            echo "::error::These GitHub secrets are missing or empty:$missing"
            exit 1
          fi
          case "$DB_URL" in
            *YOUR-PASSWORD*)
              echo "::error::SUPABASE_DB_URL still contains [YOUR-PASSWORD]. Replace it, square brackets included, with your database password."; exit 1;;
            *:\[*\]@*)
              echo "::error::SUPABASE_DB_URL has square brackets around the password. Remove the [ and ] so only the password itself is left."; exit 1;;
            *@db.*.supabase.co*)
              echo "::error::SUPABASE_DB_URL is the 'Direct connection' string (it starts with db.). GitHub can't reach that one. In Supabase press Connect, choose 'Session pooler', and copy that string instead (it contains pooler.supabase.com)."; exit 1;;
            *pooler.supabase.com*) ;;
            *)
              echo "::error::SUPABASE_DB_URL doesn't look like Supabase's 'Session pooler' string (it should contain pooler.supabase.com)."; exit 1;;
          esac

      - uses: actions/checkout@v4

      # Pinned: the commands below use this version's flags (--remote, --yes).
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Update the database
        run: supabase db push --remote="$DB_URL" --yes

      - name: Store secrets for the background jobs
        run: |
          {
            echo "INGEST_SECRET=$INGEST_SECRET"
            echo "OPENSKY_CLIENT_ID=$OPENSKY_CLIENT_ID"
            echo "OPENSKY_CLIENT_SECRET=$OPENSKY_CLIENT_SECRET"
            echo "VAPID_PUBLIC_KEY=$VAPID_PUBLIC_KEY"
            echo "VAPID_PRIVATE_KEY=$VAPID_PRIVATE_KEY"
            echo "VAPID_SUBJECT=$VAPID_SUBJECT"
            [ -n "$OPEN_METEO_API_KEY" ] && echo "OPEN_METEO_API_KEY=$OPEN_METEO_API_KEY"
            [ -n "$TWILIO_ACCOUNT_SID" ] && echo "TWILIO_ACCOUNT_SID=$TWILIO_ACCOUNT_SID"
            [ -n "$TWILIO_AUTH_TOKEN" ] && echo "TWILIO_AUTH_TOKEN=$TWILIO_AUTH_TOKEN"
            [ -n "$TWILIO_MESSAGING_SERVICE_SID" ] && echo "TWILIO_MESSAGING_SERVICE_SID=$TWILIO_MESSAGING_SERVICE_SID"
            [ -n "$SMS_DAILY_CAP" ] && echo "SMS_DAILY_CAP=$SMS_DAILY_CAP"
            true
          } > "$RUNNER_TEMP/functions.env"
          supabase secrets set --remote="$PROJECT_REF" --env-file "$RUNNER_TEMP/functions.env" --yes
          rm -f "$RUNNER_TEMP/functions.env"

      - name: Deploy the background jobs (Edge Functions)
        run: supabase functions deploy --remote="$PROJECT_REF" --use-api --yes

      - name: Tell the schedules where to call
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null
          psql "$DB_URL" -X -q -v project_url="https://$PROJECT_REF.supabase.co" \
               -v ingest_secret="$INGEST_SECRET" -f .github/scripts/vault.sql

      - name: Try each background job once
        run: |
          {
            echo "## SkyAlert backend deployed"
            echo
            echo "Each job was called once. A 200 means it ran; with no spots saved yet it has nothing to do."
            echo
            echo "| Job | Result |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for fn in ingest-metar ingest-model-cloud ingest-adsb send-alerts; do
            code=$(curl -s -o "$RUNNER_TEMP/out.json" -w '%{http_code}' -X POST \
                   -H "x-ingest-secret: $INGEST_SECRET" -H 'Content-Type: application/json' \
                   "https://$PROJECT_REF.supabase.co/functions/v1/$fn" -d '{}' --max-time 60 || echo "000")
            body=$(head -c 300 "$RUNNER_TEMP/out.json" 2>/dev/null | tr '\n|' '  ')
            echo "$fn: $code $body"
            echo "| $fn | $code \`$body\` |" >> "$GITHUB_STEP_SUMMARY"
          done
